[package]
name = "bake-releases"
version = "0.3.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/core-rs/bake-releases"
description = "Reusable releases.md tasks for Bake"
readme = "readme.md"
include = ["src/**", "tests/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["core-rs/maintainers"]

[lib]
name = "bake_releases"

[dependencies]
core-markdown = "0.2.0"
bake = ">=0.18.0"
tempfile = "3.27"

[patch.crates-io]
bake-releases = { path = "." }
