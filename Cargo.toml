[package]
name = "bake-releases"
version = "0.3.9"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/base-rs/bake-releases"
description = "Reusable releases.md tasks for Bake"
readme = "readme.md"
include = ["src/**", "tests/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[lib]
name = "bake_releases"

[dependencies]
base-markdown = "0.1.4"
bake = ">=0.20.0"
tempfile = "3.27"
toml_edit = "0.25"

[dev-dependencies]
serde_json = "1"

[patch.crates-io]
bake-releases = { path = "." }
